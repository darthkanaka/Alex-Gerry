<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex & Gerry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #FFFBF7 0%, #FFF9F2 100%);
            min-height: 100vh;
            color: #3d3d3d;
        }

        header {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .names {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 300;
            letter-spacing: 0.08em;
            color: #2c2c2c;
            margin-bottom: 12px;
        }

        .ampersand {
            font-style: italic;
            color: #c9a87c;
            margin: 0 0.1em;
        }

        .tagline {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #9a9a9a;
            margin-bottom: 40px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: #2c2c2c;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #c9a87c;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(201, 168, 124, 0.3);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        .gallery {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .gallery {
                padding: 20px 12px 60px;
                gap: 8px;
            }

            header {
                padding: 50px 20px 40px;
            }
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 3px;
            cursor: pointer;
            background: #f0ebe4;
            min-height: 100px;
        }

        .gallery-item.loaded {
            min-height: 0;
        }

        .gallery-item.hero-full {
            grid-column: span 3;
        }

        .gallery-item.hero-wide {
            grid-column: span 2;
        }

        @media (max-width: 768px) {
            .gallery-item.hero-full,
            .gallery-item.hero-wide {
                grid-column: span 3;
            }
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease, opacity 0.4s ease;
            opacity: 0;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 20, 0.97);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }

        .lightbox-content img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 2px;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease;
            z-index: 1001;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .lightbox-counter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 40px 20px 60px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .footer-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: #b0a090;
            letter-spacing: 0.05em;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, #f0ebe4 25%, #f7f3ee 50%, #f0ebe4 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            z-index: 1;
            transition: opacity 0.4s ease;
        }

        .gallery-item.loaded::before {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="names">Alex <span class="ampersand">&</span> Gerry</h1>
        <p class="tagline">Engagement Session</p>
        <a href="https://www.dropbox.com/scl/fo/vspvifupktpjqu527n09t/AE3UqchzEekB6msKxhh8B1Q?rlkey=zdwutq1k9n0f21xl0tl62bykp&st=mskq3r0t&dl=0" target="_blank" rel="noopener noreferrer" class="download-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Download All Photos
        </a>
    </header>

    <main class="gallery" id="gallery"></main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">&#8249;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
        </div>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">&#8250;</button>
        <div class="lightbox-counter"><span id="lightbox-current">1</span> / <span id="lightbox-total">57</span></div>
    </div>

    <footer>
        <p class="footer-text">A sunrise to remember</p>
    </footer>

    <script>
        const imageCount = 57;
        const startNumber = 101;
        const baseUrl = './images/';
        
        // Portrait images - based on actual image dimensions
        const portraitIndices = [2, 3, 7, 13, 17, 23, 26, 27, 28, 29, 30, 32, 39, 40, 41, 43, 44, 56, 57];

        // Hero images - spaced throughout gallery
        const heroIndices = [19, 32, 53, 57];

        const gallery = document.getElementById('gallery');
        let currentIndex = 0;
        const images = [];

        // Generate image list
        for (let i = 0; i < imageCount; i++) {
            const num = startNumber + i;
            const filename = `A_G-${num}.jpg`;
            const isPortrait = portraitIndices.includes(i + 1);
            images.push({
                src: `${baseUrl}${filename}`,
                filename: filename,
                portrait: isPortrait,
                originalIndex: i
            });
        }

        // Move shoe images (39-44) to the end
        const shoeIndices = [39, 40, 41, 42, 43, 44];
        const shoeImages = images.filter((_, i) => shoeIndices.includes(i + 1));
        const otherImages = images.filter((_, i) => !shoeIndices.includes(i + 1));
        const reorderedImages = [...otherImages, ...shoeImages];

        // Create gallery items
        reorderedImages.forEach((image, index) => {
            const item = document.createElement('div');
            const imageNum = image.originalIndex + 1;
            const isHero = heroIndices.includes(imageNum);

            let className = 'gallery-item';
            if (image.portrait) className += ' portrait';
            if (isHero) {
                className += image.portrait ? ' hero-wide' : ' hero-full';
            }
            item.className = className;
            item.onclick = () => openLightbox(index);

            const img = document.createElement('img');
            img.alt = `Alex & Gerry - Photo ${image.originalIndex + 1}`;
            img.loading = 'lazy';
            
            img.onload = () => {
                img.classList.add('loaded');
                item.classList.add('loaded');
            };
            
            img.onerror = () => {
                item.style.display = 'none';
            };
            
            img.src = image.src;
            item.appendChild(img);
            gallery.appendChild(item);
        });

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + reorderedImages.length) % reorderedImages.length;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightbox-img').src = reorderedImages[currentIndex].src;
            document.getElementById('lightbox-current').textContent = currentIndex + 1;
            document.getElementById('lightbox-total').textContent = reorderedImages.length;
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
    </script>
</body>
</html>
